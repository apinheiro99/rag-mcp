name: rag-mcp

# Production stack. RAG_PRIVATE_PATH is an operator-owned durable host root.
# It is never a Git checkout requirement and is never replaced by deployment.
services:
  db:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.7-pg19}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${RAG_PRIVATE_PATH:?absolute persistent RAG private root}/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATA_DIR: /rag-private/data
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234}
      RAG_API_TOKEN: ${RAG_API_TOKEN:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_NAME: ${MCP_NAME:-rag-server}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RAG_BUILD_VERSION: ${RAG_BUILD_VERSION:-dev}
      RAG_BUILD_COMMIT: ${RAG_BUILD_COMMIT:-}
      RAG_DEV_RELOAD: "false"
    ports:
      - "${RAG_PORT:-8000}:8000"
    volumes:
      - ${RAG_PRIVATE_PATH:?absolute persistent RAG private root}:/rag-private
      - ../..:/rag-repository:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
