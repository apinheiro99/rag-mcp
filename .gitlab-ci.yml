image: python:3.13-bookworm

stages:
  - validate
  - deploy

default:
  tags: [scope]
  before_script:
    - python3 -m pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt

"Public Surface":
  stage: validate
  script:
    - python3 scripts/public_surface_check.py

"Unit + Regression":
  stage: validate
  script:
    - python3 -m pytest -q tests/unit tests/regression

"Integration":
  stage: validate
  services:
    - name: pgvector/pgvector:0.8.7-pg19
      alias: db
  variables:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_EXPOSE_PORT: "5432"
    POSTGRES_DB: rag
    POSTGRES_USER: rag
    POSTGRES_PASSWORD: rag-ci-only
  script:
    - python3 -m pytest -q tests/integration

"Deploy Production":
  stage: deploy
  tags: [rag-prod]
  before_script: []
  script:
    - bash scripts/deploy-prod.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
