workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never

image: python:3.13-bookworm

stages:
  - validate
  - tag
  - release
  - publish
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  tags: [scope]
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .pip-cache/
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt

.branch-push-only:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

.validation-summary:
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-summary/

.validation-job:
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate

"Secret Scan":
  extends: .validation-job
  script:
    - python3 scripts/ci_gate.py "Secret Scan" python3 scripts/secret_scan.py

"Public Surface":
  extends: .validation-job
  script:
    - python3 scripts/ci_gate.py "Public Surface" python3 scripts/public_surface_check.py

"Static Checks":
  extends: .validation-job
  script:
    - python3 scripts/ci_gate.py "Python Compile" python3 -m compileall -q app scripts
    - python3 scripts/ci_gate.py "Shell Syntax" bash -n install.sh start.sh scripts/deploy-prod.sh scripts/migrate-rag-data.sh scripts/publish-github.sh scripts/reset-postgres-pgvector-dev.sh

"Unit":
  extends: .validation-job
  script:
    - python3 scripts/ci_gate.py "Unit" python3 -m pytest -q tests/unit

"Regression":
  extends: .validation-job
  script:
    - python3 scripts/ci_gate.py "Regression" python3 -m pytest -q tests/regression

"Integration":
  extends: .validation-job
  services:
    - name: pgvector/pgvector:0.8.7-pg19
      alias: db
  variables:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_EXPOSE_PORT: "5432"
    POSTGRES_DB: rag
    POSTGRES_USER: rag
    POSTGRES_PASSWORD: rag-ci-only
  script:
    - python3 scripts/ci_gate.py "Integration" python3 -m pytest -q -rP tests/integration

.ci-tag:
  stage: tag
  image: debian:13-slim
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - 'if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - 'TAG="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"; if [ "$CI_TAG_RESULT" = "fail" ]; then TAG="${TAG}-fail"; fi; export TAG'
    - git tag "$TAG" "$CI_COMMIT_SHA"
    - git push origin "refs/tags/$TAG"

ci-tag-green:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: pass
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success

ci-tag-red:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: fail
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_failure

"Build Release":
  stage: release
  image: python:3.13-bookworm
  before_script: []
  needs:
    - "Secret Scan"
    - "Public Surface"
    - "Static Checks"
    - "Unit"
    - "Regression"
    - "Integration"
    - "ci-tag-green"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - VERSION="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"; export VERSION
    - mkdir -p release
    - python3 scripts/build_release.py --version "$VERSION" --commit "$CI_COMMIT_SHA" --output release
  artifacts:
    expire_in: 14 days
    paths:
      - release/

"Publish GitHub":
  stage: publish
  tags: [rag-prod]
  before_script: []
  interruptible: false
  needs:
    - "Secret Scan"
    - "Public Surface"
    - "Static Checks"
    - "Unit"
    - "Regression"
    - "Integration"
    - "ci-tag-green"
    - job: "Build Release"
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash scripts/publish-github.sh

"Publish Gate":
  stage: publish
  image: alpine:3.21
  before_script: []
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  script:
    - 'echo "Branch pipeline: GitHub publication is intentionally skipped."'

"Deploy Gate":
  stage: deploy
  image: alpine:3.21
  before_script: []
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  script:
    - 'echo "Branch pipeline: production deployment is intentionally skipped."'

"Deploy Production":
  stage: deploy
  tags: [rag-prod]
  before_script: []
  interruptible: false
  needs:
    - job: "Build Release"
      artifacts: true
    - job: "Publish GitHub"
      artifacts: false
  script:
    - export RAG_TUNNEL_BINARY="$HOME/rag-prod/bin/tunnel-client"
    - export RAG_TUNNEL_DIR="$HOME/rag-prod/tunnel"
    - bash scripts/deploy-prod.sh
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
