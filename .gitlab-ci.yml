workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never

image: python:3.13-bookworm

stages:
  - validate
  - tag
  - publish
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  tags: [scope]
  # The pip download cache is keyed by the requirements files: jobs reuse it and install only when they change.
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .pip-cache/
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt

.branch-push-only:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

"Public Surface":
  extends: .branch-push-only
  stage: validate
  script:
    - python3 scripts/public_surface_check.py

"Unit + Regression":
  extends: .branch-push-only
  stage: validate
  script:
    - python3 -m pytest -q tests/unit tests/regression

"Integration":
  extends: .branch-push-only
  stage: validate
  services:
    - name: pgvector/pgvector:0.8.7-pg19
      alias: db
  variables:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_EXPOSE_PORT: "5432"
    POSTGRES_DB: rag
    POSTGRES_USER: rag
    POSTGRES_PASSWORD: rag-ci-only
  script:
    - python3 -m pytest -q tests/integration

.ci-tag:
  stage: tag
  image: debian:13-slim
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - 'if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - 'TAG="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"; if [ "$CI_TAG_RESULT" = "fail" ]; then TAG="${TAG}-fail"; fi; export TAG'
    - git tag "$TAG" "$CI_COMMIT_SHA"
    - git push origin "refs/tags/$TAG"

ci-tag-green:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: pass
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success

ci-tag-red:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: fail
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_failure

"Publish GitHub":
  stage: publish
  tags: [rag-prod]
  before_script: []
  needs:
    - "Public Surface"
    - "Unit + Regression"
    - "Integration"
    - "ci-tag-green"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash scripts/publish-github.sh

"Deploy Production":
  stage: deploy
  tags: [rag-prod]
  before_script: []
  needs:
    - "Publish GitHub"
  script:
    - export RAG_TUNNEL_BINARY="$HOME/rag-prod/bin/tunnel-client"
    - export RAG_TUNNEL_DIR="$HOME/rag-prod/tunnel"
    - bash scripts/deploy-prod.sh
    - python3 scripts/evaluate_retrieval.py --url http://127.0.0.1:${RAG_PORT:-8000}/mcp --cases examples/evaluation/retrieval.json --output /tmp/rag-retrieval-eval.json --k 5 --min-recall 0.80 --min-mrr 0.60 --max-avg-ms 1500
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
