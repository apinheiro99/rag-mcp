# ============================================================
# Defaults de ingestão, embeddings, busca e modo automático.
# Nada aqui é hardcoded no código: o app carrega este arquivo e
# permite sobrescrever qualquer valor em runtime pela interface
# (Configurações → Avançado), persistido no PostgreSQL.
# Unidades: chunk_size / chunk_overlap / min_chunk_size em CARACTERES.
# ============================================================

ingest:
  chunk_size: 1500          # tamanho alvo de cada chunk (caracteres)
  chunk_overlap: 200        # sobreposição entre chunks consecutivos
  min_chunk_size: 120       # chunks menores que isso são fundidos ao vizinho
  strategy: recursive       # recursive | fixed | markdown | pages
  separators: ["\n\n", "\n", ". ", " "]   # usados pela estratégia recursive
  embed_batch_size: 16      # textos por chamada /v1/embeddings
  embed_timeout: 180        # timeout (s) por chamada de embeddings
  embed_max_retries: 4      # tentativas por lote antes de marcar "waiting"
  retry_backoff_base: 5     # espera (s) após falha transitória (exponencial)
  retry_backoff_max: 300    # teto do backoff (s)
  max_file_mb: 200          # tamanho máximo por arquivo importado
  strip_whitespace: true    # normaliza espaços/linhas em branco na extração

search:
  top_k: 8                  # nº de trechos retornados por padrão
  max_top_k: 50             # teto aceito pela API/MCP
  min_score: 0.0            # score mínimo (cosseno, 0..1)
  include_all_collections: true
  hybrid_enabled: true
  lexical_candidates: 24
  hybrid_min_dense_score: 0.55
  hybrid_min_dense_candidates: 8
  fusion_rank_constant: 60
  expand_heading_context: true
  heading_context_chars: 1500
  graph_top_k: 12
  graph_max_edges: 40
  adaptive_enabled: true
  adaptive_min_rerank_score: 0.45
  adaptive_candidate_limit: 24
  binary_hnsw_enabled: true
  binary_candidate_multiplier: 8
  hnsw_ef_search: 64        # qualidade/velocidade do índice HNSW

rerank:
  enabled: true
  model: google/gemma-4-12b-qat
  mode: switch
  candidate_multiplier: 2
  max_candidates: 8
  context_length: 8192
  temperature: 0.0
  reasoning_effort: none
  seed: 42
  seed: 42
  max_tokens: 1200
  timeout: 20
  max_chars_per_candidate: 800
  qwen_instruction: Given a web search query, retrieve relevant passages that answer the query
  qwen_parallelism: 4
  qwen_top_logprobs: 20
  fail_open: true

auto:
  sample_docs: 3            # nº de documentos amostrados no modo automático
  sample_chars: 3500        # caracteres de amostra por documento
  temperature: 0.2
  max_tokens: 1500
  request_timeout: 240      # timeout (s) da chamada ao LLM

model_runtime:
  queue_maxsize: 32

classification:
  enabled: true
  staging_collection_name: Unclassified
  poll_interval_seconds: 2
  confidence_threshold: 0.90
  auto_apply_existing: true
  context_length: 8192
  reasoning_effort: none
  seed: 42
  max_attempts: 3
  retry_backoff_seconds: [60, 300, 1800]

limits:
  chunk_size_range: [200, 8000]
  chunk_overlap_range: [0, 1000]
  min_chunk_size_range: [0, 2000]
  embed_batch_size_range: [1, 128]

worker:
  poll_interval: 1.0        # intervalo (s) quando não há trabalho
  event_log_keep: 5000      # nº máximo de eventos mantidos no log da UI

workflow:
  auto_start_configured_uploads: true  # coleção já configurada: upload entra direto na fila

sources:
  poll_interval_seconds: 30
  error_retry_seconds: 5
  default_interval_seconds: 21600
  interval_options_seconds: [600, 21600, 43200, 86400]
  default_exclude_patterns: [".git/**", "node_modules/**", "__pycache__/**", ".venv/**"]

quality:
  enabled: true
  fail_on_bad: true
  min_text_chars: 50
  max_control_char_ratio: 0.01
  max_replacement_char_ratio: 0.002
  max_mojibake_marker_ratio: 0.003
  warning_ratio_factor: 0.5

# Extensões importáveis (outros arquivos são ignorados com aviso na UI)
allowed_extensions:
  - .md
  - .markdown
  - .txt
  - .text
  - .rst
  - .pdf
  - .epub
  - .mobi
