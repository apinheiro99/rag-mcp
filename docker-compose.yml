services:
  db:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.7-pg19}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "${RAG_PRIVATE_PATH:-../rag-private}/postgres:/var/lib/postgresql/data"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATA_DIR: /rag-private/data
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234}
      RAG_API_TOKEN: ${RAG_API_TOKEN:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_NAME: ${MCP_NAME:-rag-server}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RAG_BUILD_VERSION: ${RAG_BUILD_VERSION:-dev}
      RAG_BUILD_COMMIT: ${RAG_BUILD_COMMIT:-}
      RAG_ENVIRONMENT: ${RAG_ENVIRONMENT:-dev}
      RAG_DEV_RELOAD: ${RAG_DEV_RELOAD:-true}
      RAG_DEV_RELOAD_POLL_MS: ${RAG_DEV_RELOAD_POLL_MS:-1000}
    ports:
      - "${RAG_PORT:-8000}:8000"
    volumes:
      - "${RAG_PRIVATE_PATH:-../rag-private}:/rag-private"
      - "./app:/srv/rag/app:ro"
      - "./config:/srv/rag/config:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
